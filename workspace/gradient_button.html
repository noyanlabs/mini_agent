<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Class Gradient Button</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .gradient-btn {
            position: relative;
            padding: 18px 45px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3),
                        0 6px 6px rgba(102, 126, 234, 0.2);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .gradient-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            opacity: 0.6;
            z-index: -1;
            transition: opacity 0.4s ease;
        }

        .gradient-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4),
                        0 10px 10px rgba(102, 126, 234, 0.2);
        }

        .gradient-btn:hover::before {
            opacity: 0.8;
        }

        .gradient-btn:active {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .gradient-btn:active::before {
            opacity: 1;
        }

        .gradient-btn:focus {
            box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.4);
        }
    </style>
</head>
<body>
    <button class="gradient-btn">Get Started</button>
</body>
</html>
